<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #07060d; }
  * { box-sizing: border-box; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    font-family: "Inter Display", "Inter", sans-serif; color: #fff;
    background: #07060d;
  }
  .abs { position: absolute; }
  .grad { background: linear-gradient(90deg, #c4b5fd 0%, #a78bfa 30%, #22d3ee 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gradpink { background: linear-gradient(90deg, #f472b6, #a78bfa);
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { background: rgba(255,255,255,.055); border: 1.5px solid rgba(255,255,255,.12);
          border-radius: 28px; }
  .label { font-size: 26px; letter-spacing: .32em; text-transform: uppercase; font-weight: 600; color: #a5b4fc; }
  .center { left: 0; right: 0; text-align: center; }
  .shot { width: 100%; height: 100%; object-fit: cover; display: block; }
  .browser { border-radius: 18px; overflow: hidden; background: #111018;
             border: 1.5px solid rgba(255,255,255,.14); box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(124,58,237,.25); }
  .browser .bar { height: 38px; background: #1a1825; display: flex; align-items: center; gap: 9px; padding: 0 16px; }
  .browser .dot { width: 12px; height: 12px; border-radius: 50%; }
  .browser .url { margin-left: 16px; height: 22px; flex: 1; max-width: 420px; border-radius: 11px; background: #262335;
                  font-size: 14px; color: #9ca3af; display: flex; align-items: center; padding-left: 12px; }
  .phone { border-radius: 44px; background: #0d0c14; border: 7px solid #26233a; overflow: hidden;
           box-shadow: 0 30px 80px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0"></div>
  <div id="scene" class="abs" style="inset:0"></div>
  <div id="cap" class="abs" style="left:0;right:0;bottom:56px"></div>
  <div id="fade" class="abs" style="inset:0;background:#000;pointer-events:none"></div>
</div>
<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);                 // ease out cubic
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

let SEG = [], WORDS = [], ASSETS = {}, FPS = 30;

// Spread each subtitle segment's duration across its words, weighted by length.
function buildWords() {
  WORDS = [];
  SEG.forEach((s, si) => {
    const ws = s.text.replace(/\s+/g, ' ').trim().split(' ');
    const wt = ws.map(w => w.length + 2);
    const tot = wt.reduce((a, b) => a + b, 0);
    let acc = s.start;
    ws.forEach((w, i) => {
      const d = (s.end - s.start) * wt[i] / tot;
      WORDS.push({ w, s: acc, e: acc + d, seg: si });
      acc += d;
    });
  });
}
// Time when a given word is spoken (first match at or after `after`).
function cue(word, after = 0) {
  const k = word.toLowerCase();
  const f = WORDS.find(x => x.s >= after - 0.01 && x.w.toLowerCase().replace(/[^a-z0-9']/g, '').startsWith(k));
  return f ? f.s : after;
}

// pop-in style: opacity + translate + scale with overshoot
function pop(t, at, dur = .45, dy = 40, s0 = .85) {
  const p = P(t, at, at + dur);
  const b = back(p);
  return `opacity:${eo(clamp(p * 1.6))};transform:translateY(${(1 - b) * dy}px) scale(${lerp(s0, 1, b)});`;
}
function rise(t, at, dur = .5, dy = 60) {
  const p = eo(P(t, at, at + dur));
  return `opacity:${p};transform:translateY(${(1 - p) * dy}px);`;
}
function img(key, i) {
  const a = ASSETS[key];
  if (!a) return null;
  return Array.isArray(a) ? (a.length ? a[i % a.length] : null) : a;
}
// frame of an image-sequence clip asset {dir, count, fps} or a plain image path
function media(src, localT) {
  if (!src) return null;
  if (typeof src === 'string') return src;
  const n = Math.floor(localT * src.fps) % src.count;
  return `${src.dir}/f${String(n + 1).padStart(4, '0')}.jpg`;
}
function browser(src, url, w, h, extra = '', localT = 0, kb = true) {
  const s = media(src, localT);
  const z = kb ? 1 + localT * .015 : 1;
  return `<div class="browser abs" style="width:${w}px;height:${h}px;${extra}">
    <div class="bar"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div>
    <div class="url">${url}</div></div>
    <div style="height:${h - 38}px;overflow:hidden"><img class="shot" src="${s}" style="transform:scale(${z});transform-origin:50% 0"></div></div>`;
}

// ---------- background ----------
function renderBg(t, tint = 0) {
  const b = (x, y, r, c) => `radial-gradient(circle ${r}px at ${x}px ${y}px, ${c}, transparent 70%)`;
  const x1 = 400 + Math.sin(t * .35) * 220, y1 = 300 + Math.cos(t * .27) * 140;
  const x2 = 1500 + Math.cos(t * .3) * 240, y2 = 760 + Math.sin(t * .22) * 160;
  const x3 = 1000 + Math.sin(t * .2 + 2) * 400, y3 = 540 + Math.cos(t * .4) * 100;
  const purple = tint ? `rgba(239,68,68,${.45 * tint + .0})` : 'rgba(124,58,237,.42)';
  let bg = `background:${b(x1, y1, 760, purple)},${b(x2, y2, 700, tint ? 'rgba(127,29,29,.5)' : 'rgba(34,211,238,.22)')},${b(x3, y3, 600, 'rgba(236,72,153,.13)')},#07060d;`;
  // perspective grid floor
  const off = (t * 40) % 80;
  let grid = `<div class="abs" style="left:-50%;right:-50%;bottom:-120px;height:620px;transform:perspective(600px) rotateX(62deg);
    background-image:linear-gradient(rgba(167,139,250,.16) 2px, transparent 2px),linear-gradient(90deg, rgba(167,139,250,.16) 2px, transparent 2px);
    background-size:80px 80px;background-position:0 ${off}px;
    -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,.9), transparent 85%);"></div>`;
  // drifting particles
  let parts = '';
  for (let i = 0; i < 46; i++) {
    const px = rnd(i) * 1920, sp = 18 + rnd(i + 9) * 40;
    const py = (1080 - ((rnd(i + 3) * 1200 + t * sp) % 1200));
    const sz = 2 + rnd(i + 5) * 4, op = .25 + rnd(i + 7) * .5;
    parts += `<div class="abs" style="left:${px}px;top:${py}px;width:${sz}px;height:${sz}px;border-radius:50%;background:${i % 3 ? '#a78bfa' : '#22d3ee'};opacity:${op};box-shadow:0 0 ${sz * 3}px currentColor"></div>`;
  }
  return { style: bg, html: grid + parts };
}

// ---------- scenes ----------
// Each scene: [start, end, fn(t, local)]
const SCENES = [];

// 1. Intro: "#5 PixVerse"
SCENES.push([0, 2.88, (t) => {
  const hero = img('hero');
  const move = eio(P(t, 1.45, 2.0));
  const nx = lerp(960, 560, move), ns = lerp(1, .78, move);
  const nIn = back(P(t, .1, .7));
  const ring = P(t, .2, 1.2);
  const tW = cue('pixverse', 1);
  let letters = '';
  'PixVerse'.split('').forEach((c, i) => {
    const p = back(P(t, tW - .25 + i * .045, tW + .2 + i * .045));
    letters += `<span style="display:inline-block;opacity:${clamp(p * 1.5)};transform:translateY(${(1 - p) * 120}px) rotate(${(1 - p) * 12}deg)">${c}</span>`;
  });
  return `
    ${hero ? `<img class="abs" src="${media(hero, t)}" style="inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;filter:blur(6px) saturate(1.3);transform:scale(${1.1 + t * .02})">` : ''}
    <div class="abs center label" style="top:190px;${rise(t, .05, .5, 30)}">Top AI video tools</div>
    <div class="abs" style="left:${nx}px;top:540px;transform:translate(-50%,-50%) scale(${ns * lerp(.3, 1, nIn)});opacity:${clamp(nIn * 2)}">
      <div class="abs" style="left:50%;top:50%;width:${520 * eo(ring)}px;height:${520 * eo(ring)}px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid rgba(34,211,238,${.8 * (1 - ring) + .15});box-shadow:0 0 60px rgba(34,211,238,.35)"></div>
      <div class="grad" style="font-size:400px;font-weight:900;line-height:1;letter-spacing:-.04em;filter:drop-shadow(0 0 40px rgba(167,139,250,.6))">#5</div>
    </div>
    <div class="abs" style="left:860px;top:390px;font-size:220px;font-weight:900;letter-spacing:-.03em;line-height:1">${letters}</div>
    <div class="abs" style="left:872px;top:640px;${rise(t, tW + .35, .4, 20)}">
      <span style="font-size:30px;font-weight:700;letter-spacing:.25em;padding:12px 26px;border-radius:40px;border:2px solid #22d3ee;color:#67e8f9">AI VIDEO GENERATOR</span></div>`;
}]);

// 2. Built for short-form content
SCENES.push([2.88, 7.28, (t, L) => {
  const tShort = cue('short-form', 2.88), tContent = cue('content', 6);
  const sweep = eo(P(t, tShort, tShort + .5));
  const pulse = P(t, tContent, tContent + .5);
  let phones = '';
  [-1, 0, 1].forEach((k, i) => {
    const at = 3.25 + i * .28;
    const p = back(P(t, at, at + .6));
    const x = 960 + k * 410, rot = k * 7;
    const src = media(img('gallery', i), t - at);
    const glow = pulse > 0 && pulse < 1 ? Math.sin(pulse * Math.PI) : 0;
    const prog = ((t - at) * .22 + i * .3) % 1;
    const grads = ['#7c3aed,#ec4899', '#0891b2,#7c3aed', '#db2777,#f59e0b'];
    phones += `<div class="phone abs" style="left:${x - 150}px;top:315px;width:300px;height:534px;opacity:${clamp(p * 2)};
        transform:translateY(${(1 - p) * 500 + Math.sin(t * 1.4 + i) * 8}px) rotate(${rot}deg);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 ${30 + glow * 70}px rgba(34,211,238,${.2 + glow * .5})">
      ${src ? `<img class="shot" src="${src}" style="transform:scale(${1.05 + (t - at) * .03})">`
            : `<div style="width:100%;height:100%;background:linear-gradient(160deg,${grads[i]});position:relative">
                 <div class="abs" style="left:50%;top:45%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center">
                   <div style="width:0;height:0;border-left:30px solid #fff;border-top:19px solid transparent;border-bottom:19px solid transparent;margin-left:8px"></div></div></div>`}
      <div class="abs" style="left:18px;right:18px;bottom:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"><div style="width:${prog * 100}%;height:100%;background:#fff;border-radius:3px"></div></div>
      <div class="abs" style="right:14px;bottom:70px;display:flex;flex-direction:column;gap:18px;align-items:center">
        ${['♥', '➤', '⋯'].map(c => `<div style="width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:22px">${c}</div>`).join('')}</div>
    </div>`;
  });
  // floating hearts
  let hearts = '';
  for (let i = 0; i < 10; i++) {
    const st = 4 + i * .3, p = P(t, st, st + 2.2);
    if (p <= 0 || p >= 1) continue;
    hearts += `<div class="abs" style="left:${1420 + rnd(i) * 140}px;top:${800 - p * 520}px;font-size:${26 + rnd(i + 2) * 20}px;color:${i % 2 ? '#f472b6' : '#fb7185'};opacity:${Math.sin(p * Math.PI)};transform:rotate(${(rnd(i + 4) - .5) * 40}deg)">♥</div>`;
  }
  return `
    <div class="abs center" style="top:70px;${rise(t, 2.95, .45, 30)}"><span style="font-size:44px;font-weight:600;color:#cbd5e1">Designed heavily around</span></div>
    <div class="abs center" style="top:126px;${pop(t, tShort - .05, .5, 50, .8)}">
      <span style="position:relative;display:inline-block;font-size:128px;font-weight:900;letter-spacing:-.02em" class="grad">SHORT-FORM CONTENT
        <span class="abs" style="left:0;bottom:-6px;height:10px;width:${sweep * 100}%;border-radius:5px;background:linear-gradient(90deg,#a78bfa,#22d3ee)"></span></span></div>
    ${phones}${hearts}`;
}]);

// 3. TikTok / Shorts / Reels / Promo -> worth testing
SCENES.push([7.28, 14.4, (t) => {
  const items = [
    { k: 'tiktoks', name: 'TikTok', c1: '#25f4ee', c2: '#fe2c55', icon: '<path d="M44 14v28a12 12 0 1 1-12-12" stroke-width="7" fill="none"/><path d="M44 14c2 8 8 12 14 12" stroke-width="7" fill="none"/>' },
    { k: 'youtube', name: 'YouTube Shorts', c1: '#ff4d4d', c2: '#ff0000', icon: '<rect x="10" y="18" width="52" height="38" rx="12" stroke-width="6" fill="none"/><path d="M30 28l14 9-14 9z" stroke="none"/>' },
    { k: 'instagram', name: 'Instagram Reels', c1: '#f58529', c2: '#c13584', icon: '<rect x="12" y="12" width="48" height="48" rx="14" stroke-width="6" fill="none"/><circle cx="36" cy="36" r="11" stroke-width="6" fill="none"/><circle cx="50" cy="22" r="3.5" stroke="none"/>' },
    { k: 'promotional', name: 'Promo Videos', c1: '#a78bfa', c2: '#22d3ee', icon: '<path d="M12 30v12h10l22 14V16L22 30z" stroke-width="6" fill="none" stroke-linejoin="round"/><path d="M52 26c4 4 4 16 0 20" stroke-width="6" fill="none" stroke-linecap="round"/>' },
  ];
  const tWorth = cue('definitely', 12.6);
  const shrink = eio(P(t, tWorth - .1, tWorth + .4));
  let cards = '';
  items.forEach((it, i) => {
    const at = cue(it.k, 7.28) - .12;
    const p = back(P(t, at, at + .5));
    const next = i < 3 ? cue(items[i + 1].k, 7.28) - .12 : tWorth - .2;
    const active = t >= at && t < next ? 1 : 0;
    const x = 120 + i * 430;
    cards += `<div class="card abs" style="left:${x}px;top:${lerp(330, 250, shrink)}px;width:390px;height:330px;opacity:${clamp(p * 2) * lerp(1, .35, shrink)};
        transform:translateY(${(1 - p) * 80}px) scale(${lerp(.7, 1, p) * (1 + active * .04) * lerp(1, .82, shrink)});
        border-color:${active ? it.c1 : 'rgba(255,255,255,.12)'};box-shadow:${active ? `0 0 50px ${it.c1}55` : 'none'};
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
      <div style="width:130px;height:130px;border-radius:34px;background:linear-gradient(135deg,${it.c1},${it.c2});display:flex;align-items:center;justify-content:center">
        <svg width="72" height="72" viewBox="0 0 72 72" stroke="#fff" fill="#fff">${it.icon}</svg></div>
      <div style="font-size:40px;font-weight:800">${it.name}</div></div>`;
  });
  const sp = back(P(t, tWorth + .1, tWorth + .55));
  const stamp = t > tWorth ? `<div class="abs" style="left:960px;top:${lerp(560, 640, shrink)}px;transform:translate(-50%,-50%) rotate(${lerp(-14, -4, sp)}deg) scale(${lerp(2.4, 1, sp)});opacity:${clamp(sp * 2)}">
      <div style="display:flex;align-items:center;gap:28px;padding:26px 54px;border:7px solid #22d3ee;border-radius:24px;background:rgba(7,6,13,.85);box-shadow:0 0 80px rgba(34,211,238,.45)">
        <svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="#22d3ee"/><path d="M24 43l12 12 24-26" stroke="#07060d" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size:96px;font-weight:900;letter-spacing:.02em;color:#e0f2fe;white-space:nowrap">WORTH TESTING</span></div></div>` : '';
  return `<div class="abs center" style="top:120px;${rise(t, 7.3, .45, 30)};opacity:${1 - shrink}"><span style="font-size:64px;font-weight:800">Perfect for <span class="grad">short-form creators</span></span></div>
    ${cards}${stamp}`;
}]);

// 4. Start free / first-timers
SCENES.push([14.4, 24.24, (t) => {
  const tPay = cue('paying', 16), tSub = cue('subscription', 17);
  const tFirst = cue('first', 22), tExp = cue('experimenting', 19.4);
  const split = eio(P(t, 19.3, 19.9));
  const pricing = img('pricing');
  // price countdown
  const cd = eio(P(t, tPay - .1, tSub + .3));
  const price = (lerp(29.99, 0, cd)).toFixed(2);
  const strike = eo(P(t, tSub, tSub + .35));
  const freeP = back(P(t, tSub + .45, tSub + .9));
  const cardX = lerp(960, 520, split);
  const left = pricing && split > 0
    ? browser(pricing, 'app.pixverse.ai', 760, 520, `left:${lerp(1920, 140, split)}px;top:250px;opacity:${split}`, t - 19.3)
    : '';
  const card = `<div class="card abs" style="left:${cardX - 330}px;top:${lerp(300, 330, split)}px;width:660px;height:420px;opacity:${pricing ? 1 - split : 1};${pop(t, 14.55, .5, 60, .8)}
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
      <div style="font-size:30px;letter-spacing:.2em;color:#a5b4fc;font-weight:700">SUBSCRIPTION</div>
      <div style="position:relative;font-size:150px;font-weight:900;font-variant-numeric:tabular-nums">$${price}
        <div class="abs" style="left:-10px;top:52%;height:12px;width:${strike * 104}%;background:#fb7185;border-radius:6px;transform:rotate(-6deg);box-shadow:0 0 20px #fb7185"></div></div>
      <div style="font-size:30px;color:#94a3b8">per month</div>
      <div class="abs" style="right:-40px;top:-46px;transform:rotate(12deg) scale(${lerp(2, 1, freeP)});opacity:${clamp(freeP * 2)}">
        <div style="padding:18px 34px;border-radius:22px;background:linear-gradient(135deg,#22d3ee,#a78bfa);font-size:52px;font-weight:900;color:#07060d;box-shadow:0 0 60px rgba(34,211,238,.5)">FREE TO START</div></div>
    </div>`;
  const checks = [['No upfront cost', tExp - .3], ['Experiment freely', tExp + .5], ['Learn as you go', cue('video', tExp) + .1]];
  let list = '';
  checks.forEach(([txt, at], i) => {
    list += `<div style="display:flex;align-items:center;gap:22px;margin-bottom:34px;${rise(t, at, .45, 30)}">
      <svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="26" fill="rgba(34,211,238,.18)" stroke="#22d3ee" stroke-width="3"/><path d="M16 29l8 8 16-17" stroke="#22d3ee" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-size:46px;font-weight:700">${txt}</span></div>`;
  });
  const badge = back(P(t, tFirst - .1, tFirst + .35));
  return `
    <div class="abs center" style="top:90px;opacity:${1 - clamp(split * 2.5)}"><div style="${rise(t, 14.45, .5, 30)}"><span style="font-size:76px;font-weight:900">Get started <span class="grad">without paying</span></span></div></div>
    <div class="abs" style="left:1000px;top:110px;opacity:${clamp(split * 2.5 - 1.5)}"><span style="font-size:60px;font-weight:900">New to <span class="grad">AI video?</span></span></div>
    ${left}${card}
    <div class="abs" style="left:1010px;top:300px;opacity:${split}">${list}</div>
    <div class="abs" style="left:1010px;top:660px;opacity:${clamp(badge * 2)};transform:scale(${lerp(.6, 1, badge)});transform-origin:left center">
      <span style="font-size:36px;font-weight:800;letter-spacing:.14em;padding:16px 30px;border-radius:40px;background:rgba(244,114,182,.15);border:3px solid #f472b6;color:#fbcfe8">★ BEGINNER FRIENDLY</span></div>`;
}]);

// 5. Styles, effects, idea -> video, no complicated software
SCENES.push([24.24, 32.4, (t) => {
  const tStyles = cue('styles', 24.24), tFx = cue('effects', 25), tTurn = cue('turn', 27), tShortV = cue('short', 27.5);
  const tLearn = cue('learn', 30), tSoft = cue('software', 31);
  const phaseB = eio(P(t, tTurn - .25, tTurn + .25));
  const styles = [['Anime', '#f472b6,#7c3aed'], ['3D Cartoon', '#f59e0b,#ef4444'], ['Realistic', '#475569,#0ea5e9'],
                  ['Clay', '#d97706,#fde68a'], ['Cyberpunk', '#7c3aed,#22d3ee'], ['Watercolor', '#34d399,#60a5fa']];
  let tiles = '';
  styles.forEach(([n, g], i) => {
    const at = tStyles - .1 + i * .13;
    const p = back(P(t, at, at + .45));
    const col = i % 3, row = Math.floor(i / 3);
    const src = media(img('styles', i), t - at);
    const fx = P(t, tFx + i * .08, tFx + .9 + i * .08);
    const shimmer = fx > 0 && fx < 1 ? `<div class="abs" style="inset:0;background:linear-gradient(110deg,transparent ${fx * 140 - 40}%,rgba(255,255,255,.55) ${fx * 140 - 20}%,transparent ${fx * 140}%)"></div>` : '';
    const hue = t > tFx ? (t - tFx) * 40 * (i % 2 ? 1 : -1) : 0;
    tiles += `<div class="abs" style="left:${300 + col * 450}px;top:${200 + row * 330}px;width:420px;height:300px;border-radius:24px;overflow:hidden;
        opacity:${clamp(p * 2) * (1 - phaseB)};transform:scale(${lerp(.6, 1, p) * lerp(1, .8, phaseB)}) translateY(${-phaseB * 60}px);box-shadow:0 20px 50px rgba(0,0,0,.5)">
        ${src ? `<img class="shot" src="${src}" style="filter:hue-rotate(${hue}deg)">` : `<div style="width:100%;height:100%;background:linear-gradient(135deg,${g});filter:hue-rotate(${hue}deg)"></div>`}
        ${shimmer}
        <div class="abs" style="left:18px;bottom:16px;font-size:34px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.6)">${n}</div></div>`;
  });
  const fxChips = ['✦ Glow', '✸ Explode', '◎ Zoom', '∿ Morph'].map((c, i) => {
    const at = tFx + i * .15;
    return `<span style="display:inline-block;margin:0 10px;padding:12px 26px;border-radius:30px;background:rgba(124,58,237,.3);border:2px solid #a78bfa;font-size:32px;font-weight:700;${pop(t, at, .4, 20, .6)}">${c}</span>`;
  }).join('');
  // Phase B: idea -> video
  const prompt = 'A cat surfing a giant wave at sunset';
  const typed = Math.floor(prompt.length * P(t, tTurn + .1, tTurn + 1.4));
  const caret = Math.floor(t * 2.5) % 2 ? '|' : '';
  const gen = P(t, tShortV - .5, tShortV - .3);
  const vid = back(P(t, tShortV - .2, tShortV + .35));
  const genSrc = img('generator');
  const outSrc = media(img('result'), t - tShortV);
  const genBox = genSrc
    ? browser(genSrc, 'app.pixverse.ai', 820, 470, 'left:0;top:0', t - tTurn)
    : `<div class="card" style="width:820px;padding:34px 38px">
        <div style="display:flex;align-items:center;gap:16px;font-size:30px;color:#a5b4fc;font-weight:700;letter-spacing:.12em">
          <svg width="40" height="40" viewBox="0 0 40 40"><path d="M20 4a11 11 0 0 0-6 20v5h12v-5A11 11 0 0 0 20 4z" fill="#fde047"/><rect x="14" y="31" width="12" height="4" rx="2" fill="#fde047"/></svg>YOUR IDEA</div>
        <div style="margin-top:22px;min-height:150px;border-radius:18px;background:rgba(0,0,0,.35);border:2px solid rgba(167,139,250,.4);padding:24px;font-size:42px;font-weight:600;line-height:1.3">${esc(prompt.slice(0, typed))}<span style="color:#22d3ee">${caret}</span></div>
        <div style="margin-top:26px;display:flex;justify-content:flex-end">
          <div style="padding:18px 40px;border-radius:16px;font-size:34px;font-weight:800;background:linear-gradient(90deg,#7c3aed,#22d3ee);transform:scale(${1 - Math.sin(gen * Math.PI) * .1});box-shadow:0 0 ${gen * 50}px rgba(34,211,238,.7)">Generate ✦</div></div></div>`;
  const arrowP = eo(P(t, tShortV - .4, tShortV));
  const sw = P(t, tLearn - .1, tLearn + .4), x = eo(P(t, tSoft, tSoft + .3));
  let tracks = '';
  [[40, 200, '#7c3aed'], [260, 140, '#22d3ee'], [420, 120, '#f472b6'], [0, 160, '#f59e0b'], [190, 230, '#34d399'], [80, 120, '#60a5fa'], [230, 260, '#a78bfa']].forEach(([l, w, c], i) => {
    tracks += `<div class="abs" style="left:${70 + l}px;top:${24 + (i % 3) * 34}px;width:${w}px;height:26px;border-radius:6px;background:${c};opacity:.75"></div>`;
  });
  return `
    <div class="abs center" style="top:60px;opacity:${1 - clamp(phaseB * 2.5)}"><span style="font-size:70px;font-weight:900;${rise(t, tStyles - .2, .4, 20)}">Different <span class="grad">styles</span> &amp; <span class="gradpink">effects</span></span></div>
    ${tiles}
    <div class="abs center" style="top:848px;opacity:${1 - clamp(phaseB * 3)}">${fxChips}</div>
    <div class="abs center" style="top:70px;opacity:${clamp(phaseB * 2.5 - 1.5)}"><span style="font-size:66px;font-weight:900">Simple idea <span class="grad">→ short video</span></span></div>
    <div class="abs" style="left:${lerp(-900, 140, phaseB)}px;top:270px;opacity:${phaseB * (1 - .85 * sw)};filter:blur(${sw * 6}px)">${genBox}</div>
    <svg class="abs" style="left:1000px;top:440px;opacity:${arrowP}" width="200" height="80"><path d="M10 40 H${10 + 160 * arrowP}" stroke="#22d3ee" stroke-width="8" stroke-linecap="round"/><path d="M${150 * arrowP + 10} 18 L${172 * arrowP + 10} 40 L${150 * arrowP + 10} 62" stroke="#22d3ee" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="phone abs" style="left:1290px;top:200px;width:330px;height:586px;opacity:${clamp(vid * 2) * (1 - .85 * sw)};filter:blur(${sw * 6}px);transform:scale(${lerp(.5, 1, vid)});box-shadow:0 0 70px rgba(34,211,238,.4)">
      ${outSrc ? `<img class="shot" src="${outSrc}">` : `<div style="width:100%;height:100%;background:linear-gradient(180deg,#f97316 0%,#db2777 45%,#1e3a8a 70%,#0ea5e9 100%);position:relative">
        <div class="abs" style="left:50%;top:30%;width:120px;height:120px;border-radius:50%;background:#fde68a;transform:translate(-50%,-50%);box-shadow:0 0 80px #fde68a"></div>
        <div class="abs" style="left:-20%;right:-20%;top:${62 + Math.sin(t * 3) * 3}%;height:140px;border-radius:50%;background:rgba(255,255,255,.35)"></div></div>`}
      <div class="abs" style="left:18px;right:18px;bottom:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)"><div style="width:${((t - tShortV) * 30) % 100}%;height:100%;background:#fff"></div></div></div>
    <div class="abs" style="left:560px;top:${lerp(1100, 400, eo(sw))}px;width:800px;height:220px;opacity:${sw}">
      <div class="card" style="position:relative;width:100%;height:100%;background:rgba(20,18,30,.95);overflow:hidden">
        <div class="abs" style="left:24px;top:10px;font-size:22px;color:#94a3b8;font-weight:700;letter-spacing:.15em">COMPLICATED EDITING SOFTWARE</div>
        <div class="abs" style="left:0;right:0;top:40px">${tracks}</div>
        <div class="abs" style="left:${70 + (t * 80) % 560}px;top:44px;width:3px;height:110px;background:#fb7185"></div></div>
      <svg class="abs" style="left:0;top:0;opacity:${x}" width="800" height="220"><path d="M60 20 L${60 + 680 * x} ${20 + 180 * x}" stroke="#fb7185" stroke-width="16" stroke-linecap="round"/><path d="M740 20 L${740 - 680 * x} ${20 + 180 * x}" stroke="#fb7185" stroke-width="16" stroke-linecap="round"/></svg>
      <div class="abs" style="left:0;right:0;top:-90px;text-align:center;font-size:60px;font-weight:900;color:#fda4af;opacity:${x}">NOT NEEDED</div></div>`;
}]);

// 6. But there's a catch
SCENES.push([32.4, 33.76, (t) => {
  const L = t - 32.4;
  const p = back(P(L, 0, .35));
  const f = Math.floor(t * FPS);
  const j = L < .5 || (f % 9 < 2) ? 1 : 0;
  const ox = j ? (rnd(f) - .5) * 26 : 0, oy = j ? (rnd(f + 1) - .5) * 14 : 0;
  const txt = `BUT THERE'S<br>A CATCH`;
  const layer = (c, dx, dy, o) => `<div class="abs" style="left:0;right:0;top:300px;text-align:center;font-size:190px;font-weight:900;line-height:.95;letter-spacing:-.02em;color:${c};transform:translate(${dx}px,${dy}px);opacity:${o};mix-blend-mode:screen">${txt}</div>`;
  const tri = back(P(L, .05, .4));
  return `<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 50%, rgba(239,68,68,.35), rgba(7,6,13,.9) 70%)"></div>
    <div class="abs" style="left:960px;top:200px;transform:translate(-50%,-50%) scale(${tri})">
      <svg width="140" height="124" viewBox="0 0 140 124"><path d="M70 6 L134 118 H6 Z" fill="#ef4444" stroke="#fecaca" stroke-width="5" stroke-linejoin="round"/><rect x="63" y="40" width="14" height="44" rx="6" fill="#fff"/><circle cx="70" cy="99" r="8" fill="#fff"/></svg></div>
    <div class="abs" style="inset:0;transform:translate(${ox}px,${oy}px) scale(${lerp(1.6, 1, p)});opacity:${clamp(p * 2)}">
      ${layer('#22d3ee', -8 * j - 3, 0, .8)}${layer('#ef4444', 8 * j + 3, 0, .8)}${layer('#fff', 0, 0, 1)}</div>`;
}]);

// 7. Realism check
SCENES.push([33.76, 40.4, (t) => {
  const tReal = cue('realistic', 33.7), tCine = cue('cinematic', 35), tTop = cue('wouldn', 37.5), tTopW = cue('top', 38.5);
  const phaseB = eio(P(t, tTop - .2, tTop + .3));
  const bars = [['Short-form & social', 92, '#22d3ee', 34.0], ['Styles & effects', 88, '#a78bfa', 34.25],
                ['Realistic human movement', 55, '#f59e0b', tReal + .2], ['Cinematic footage', 50, '#f59e0b', tCine + .1]];
  let html = '';
  bars.forEach(([n, v, c, at], i) => {
    const p = eo(P(t, at, at + .8));
    const warn = i >= 2;
    html += `<div style="margin-bottom:40px;${rise(t, at - .15, .35, 20)}">
      <div style="display:flex;justify-content:space-between;font-size:38px;font-weight:700;margin-bottom:14px"><span>${warn ? '⚠ ' : ''}${n}</span><span style="color:${c};font-variant-numeric:tabular-nums">${Math.round(v * p)}%</span></div>
      <div style="height:26px;border-radius:13px;background:rgba(255,255,255,.08);overflow:hidden"><div style="height:100%;width:${v * p}%;border-radius:13px;background:linear-gradient(90deg,${c}aa,${c});box-shadow:0 0 24px ${c}"></div></div></div>`;
  });
  // right side: sample human clip with scanning line, or podium in phase B
  const human = media(img('human'), t - 33.76);
  const scan = (t * .6) % 1;
  const sample = `<div class="abs" style="left:1230px;top:190px;width:520px;height:600px;border-radius:26px;overflow:hidden;border:2px solid rgba(245,158,11,.6);opacity:${clamp(P(t, tReal, tReal + .4)) * (1 - phaseB)};
        transform:scale(${lerp(.85, 1, eo(P(t, tReal, tReal + .5)))})">
      ${human ? `<img class="shot" src="${human}">` : `<div style="width:100%;height:100%;background:linear-gradient(180deg,#1e1b4b,#0f172a);position:relative">
         <svg class="abs" style="left:110px;top:90px" width="300" height="440" viewBox="0 0 300 440" fill="none" stroke="#fcd34d" stroke-width="10" stroke-linecap="round">
           <circle cx="150" cy="60" r="42"/><path d="M150 102 V260"/><path d="M150 140 L${80 + Math.sin(t * 4) * 20} 230"/><path d="M150 140 L${220 - Math.sin(t * 4) * 20} 230"/>
           <path d="M150 260 L${100 + Math.sin(t * 4) * 25} 410"/><path d="M150 260 L${200 - Math.sin(t * 4) * 25} 410"/></svg></div>`}
      <div class="abs" style="left:0;right:0;top:${scan * 100}%;height:4px;background:#f59e0b;box-shadow:0 0 30px 8px rgba(245,158,11,.6)"></div>
      <div class="abs" style="left:20px;top:18px;font-size:24px;font-weight:800;letter-spacing:.15em;color:#fcd34d;background:rgba(0,0,0,.5);padding:8px 14px;border-radius:10px">REALISM CHECK</div></div>`;
  // podium
  const pd = eio(P(t, tTop, tTop + .5));
  const drop = eio(P(t, tTopW - .15, tTopW + .35));
  const podium = `<div class="abs" style="left:1160px;top:250px;width:660px;height:560px;opacity:${phaseB}">
      ${[[1, 220, 300, 230], [2, 0, 200, 330], [3, 440, 140, 390]].map(([n, x, h, y]) => `
        <div class="abs" style="left:${x}px;top:${y + (1 - pd) * 200}px;width:210px;height:${h}px;border-radius:16px 16px 0 0;background:linear-gradient(180deg,rgba(167,139,250,.5),rgba(124,58,237,.15));border:2px solid rgba(167,139,250,.6);display:flex;justify-content:center;padding-top:16px;font-size:70px;font-weight:900">${n}</div>`).join('')}
      <div class="abs" style="left:${lerp(225, 440, drop)}px;top:${lerp(140, 480, drop) - Math.sin(drop * Math.PI) * 60}px;transform:rotate(${drop * 22}deg);width:200px;text-align:center">
        <div style="padding:12px 0;border-radius:14px;background:#ef4444;font-size:34px;font-weight:900;box-shadow:0 0 30px rgba(239,68,68,.6)">PixVerse</div></div>
      <div class="abs" style="left:250px;top:110px;font-size:90px;font-weight:900;color:#fca5a5;opacity:${drop}">?</div></div>`;
  return `<div class="abs" style="left:150px;top:90px;${rise(t, 33.8, .4, 20)}"><span style="font-size:64px;font-weight:900">Need <span style="color:#fbbf24">realism</span>?</span></div>
    <div class="abs" style="left:150px;top:260px;width:900px">${html}</div>
    ${sample}${podium}
    <div class="abs" style="left:150px;top:${lerp(1100, 770, phaseB)}px;opacity:${phaseB}">
      <span style="font-size:42px;font-weight:800;padding:16px 30px;border-radius:16px;background:rgba(239,68,68,.15);border:3px solid #ef4444;color:#fecaca">Not my #1 pick for cinematic realism</span></div>`;
}]);

// 8. Next up
SCENES.push([40.4, 99, (t) => {
  const L = t - 40.4;
  const p = back(P(L, 0, .5));
  const tInt = cue('interesting', 41.5);
  const zoom = eo(P(L, 0, 3.3));
  const glow = P(t, tInt, tInt + .6);
  return `<div class="abs center label" style="top:200px;${rise(t, 40.45, .4, 20)}">Up next</div>
    <div class="abs" style="left:960px;top:500px;transform:translate(-50%,-50%) scale(${lerp(.4, 1, p) * (1 + zoom * .12)});opacity:${clamp(p * 2)}">
      <div style="font-size:380px;font-weight:900;line-height:1;letter-spacing:-.04em;filter:blur(${lerp(14, 0, eo(P(L, .3, 1.2)))}px) drop-shadow(0 0 ${40 + glow * 60}px rgba(34,211,238,.7))" class="grad">#4</div></div>
    <div class="abs center" style="top:730px;${rise(t, tInt - .3, .5, 30)}"><span style="font-size:58px;font-weight:800">AI tools that get <span class="grad">much more interesting</span></span></div>`;
}]);

// ---------- captions ----------
function renderCap(t) {
  if (t >= 32.35 && t < 33.76) return '';   // big on-screen text already says it
  const si = SEG.findIndex(s => t >= s.start && t < s.end);
  if (si < 0) return '';
  const ws = WORDS.filter(w => w.seg === si);
  const s = SEG[si];
  const inP = eo(P(t, s.start, s.start + .15));
  const html = ws.map(w => {
    const on = t >= w.s && t < w.e, past = t >= w.e;
    const pp = back(P(t, w.s, w.s + .18));
    return `<span style="display:inline-block;margin:0 .17em;color:${on ? '#22d3ee' : past ? '#fff' : 'rgba(255,255,255,.55)'};transform:scale(${on ? lerp(1, 1.1, pp) : 1})">${esc(w.w)}</span>`;
  }).join('');
  return `<div style="text-align:center;opacity:${inP};transform:translateY(${(1 - inP) * 12}px)">
    <div style="display:inline-block;max-width:1500px;padding:14px 34px;border-radius:20px;background:rgba(7,6,13,.72);border:1.5px solid rgba(167,139,250,.25);
       font-size:46px;font-weight:800;line-height:1.25;text-shadow:0 2px 10px rgba(0,0,0,.6)">${html}</div></div>`;
}

// ---------- main ----------
window.init = (seg, assets, fps) => { SEG = seg; ASSETS = assets || {}; FPS = fps || 30; buildWords(); };
window.render = (t) => {
  const catchTint = Math.sin(P(t, 32.3, 33.9) * Math.PI);
  const bg = renderBg(t, catchTint);
  const bgEl = document.getElementById('bg');
  bgEl.setAttribute('style', 'inset:0;' + bg.style);
  bgEl.innerHTML = bg.html;
  let out = '';
  SCENES.forEach(([a, b, fn], i) => {
    const pad = .3;
    if (t < a - .05 || t > b + pad) return;
    const inP = i === 0 ? 1 : eo(P(t, a + .02, a + .32));
    const outP = i === SCENES.length - 1 ? 0 : eio(P(t, b - .12, b + .16));
    if (outP >= 1) return;
    const sc = lerp(1.06, 1, inP) * lerp(1, .94, outP);
    const blur = (1 - inP) * 10 + outP * 10;
    out += `<div class="abs" style="inset:0;opacity:${inP * (1 - outP)};transform:scale(${sc});filter:${blur > .1 ? `blur(${blur}px)` : 'none'}">${fn(t, t - a)}</div>`;
  });
  document.getElementById('scene').innerHTML = out;
  document.getElementById('cap').innerHTML = renderCap(t);
  const end = SEG.length ? SEG[SEG.length - 1].end : 44;
  const fadeIn = 1 - P(t, 0, .25), fadeOut = P(t, window.DURATION - .45, window.DURATION);
  document.getElementById('fade').style.opacity = Math.max(fadeIn, fadeOut);
  // wait for any images to decode
  const imgs = [...document.images].filter(i => !i.complete);
  return Promise.all(imgs.map(i => new Promise(r => { i.onload = i.onerror = r; })));
};
</script>
</body>
