<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- assets ----------
const TOOLS = [
  { name: 'Kling',    file: '2.png', t: 4.22, color: '#18e0f2', grad: ['#7CFFB2', '#18e0f2', '#2563ff'] },
  { name: 'Hailuo',   file: '1.png', t: 5.12, color: '#ff5a3c', grad: ['#ffb000', '#ff4d4d', '#d55cf0'] },
  { name: 'Vidu',     file: '5.png', t: 6.24, color: '#2f9bff', grad: ['#5ee7ff', '#2f9bff', '#3b5bff'] },
  { name: 'Pika',     file: '3.png', t: 7.14, color: '#dfe6f5', grad: ['#ffffff', '#c9d3e8', '#8fa0c4'] },
  { name: 'PixVerse', file: '4.png', t: 8.24, color: '#c25cf5', grad: ['#ff9a4d', '#e45cf0', '#7b3bff'] },
];
const imgs = {};
function loadImages() {
  return Promise.all(TOOLS.map(tl => new Promise(res => {
    const im = new Image(); im.onload = () => { imgs[tl.name] = im; res(); }; im.src = tl.file;
  })));
}

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInCubic = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eOutElastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
const lerp = (a, b, u) => a + (b - a) * u;
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(h1, h2, u) { const a = hexRgb(h1), b = hexRgb(h2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], u))).join(',')})`; }
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const font = (size, weight = 900) => `${weight} ${size}px "Inter Display", "Inter", sans-serif`;
const EMOJI = size => `${size}px "Noto Color Emoji"`;

function txt(text, x, y, o = {}) {
  const size = o.size || 100;
  ctx.save();
  ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  const s = o.scale ?? 1; ctx.scale(s, s);
  ctx.font = o.emoji ? EMOJI(size) : font(size, o.weight ?? 900);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  const w = ctx.measureText(text).width;
  if (o.shadow !== false) { ctx.shadowColor = o.shadowColor || 'rgba(0,0,0,0.5)'; ctx.shadowBlur = o.shadowBlur ?? 30; ctx.shadowOffsetY = 8; }
  if (o.grad) {
    const g = ctx.createLinearGradient(-w / 2, -size / 2, w / 2, size / 2);
    o.grad.forEach((c, i) => g.addColorStop(i / (o.grad.length - 1), c));
    ctx.fillStyle = g;
  } else ctx.fillStyle = o.color || '#fff';
  ctx.fillText(text, 0, 0);
  ctx.restore();
  return w;
}
function measure(text, size, weight = 900, emoji = false) {
  ctx.save(); ctx.font = emoji ? EMOJI(size) : font(size, weight); const w = ctx.measureText(text).width; ctx.restore(); return w;
}
// pop-in for a single word, timed to the voice
function pop(t, t0, text, x, y, o = {}) {
  const u = p(t, t0 - 0.05, t0 + 0.36);
  if (u <= 0) return;
  const size = o.size || 100;
  const s = 0.35 + 0.65 * eOutBack(u);
  const a = clamp(u * 3);
  const dy = (1 - eOutCubic(u)) * size * 0.45;
  const rot = (1 - eOutCubic(u)) * (o.spin ?? -0.12);
  txt(text, x, y + dy, { ...o, scale: s * (o.scale ?? 1), alpha: a * (o.alpha ?? 1), rot: (o.rot || 0) + rot });
}
// a horizontal line of words, each popping at its own time
function line(t, words, cx, y, size, o = {}) {
  const gap = size * (o.gap ?? 0.26);
  const ws = words.map(w => measure(w.text, w.size || size, w.weight || o.weight || 900, w.emoji));
  const total = ws.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
  let x = cx - total / 2;
  words.forEach((w, i) => {
    const wx = x + ws[i] / 2; x += ws[i] + gap;
    pop(t, w.t, w.text, wx, y, { size: w.size || size, ...o, ...w });
  });
}
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(color, a)); g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function drawContain(im, cx, cy, size) {
  const k = size / Math.max(im.width, im.height);
  const w = im.width * k, h = im.height * k;
  ctx.drawImage(im, cx - w / 2, cy - h / 2, w, h);
}
function ring(t, t0, x, y, color, r0 = 80, r1 = 300, dur = 0.6, lw = 10) {
  const u = p(t, t0, t0 + dur); if (u <= 0 || u >= 1) return;
  ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha *= (1 - u); ctx.lineWidth = lw * (1 - u) + 1;
  ctx.beginPath(); ctx.arc(x, y, lerp(r0, r1, eOutCubic(u)), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function sparks(t, t0, x, y, color, n = 12, r0 = 120, r1 = 260, dur = 0.5, seed = 1) {
  const u = p(t, t0, t0 + dur); if (u <= 0 || u >= 1) return;
  const R = rng(seed);
  ctx.save(); ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineWidth = 6; ctx.globalAlpha *= (1 - u);
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + R() * 0.3;
    const e = eOutCubic(u), ra = lerp(r0, r1, e), rb = lerp(r0, r1, Math.max(0, e - 0.25 + 0.25 * u));
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * rb, y + Math.sin(a) * rb); ctx.lineTo(x + Math.cos(a) * ra, y + Math.sin(a) * ra); ctx.stroke();
  }
  ctx.restore();
}
function confetti(t, t0, x, y, n = 70, seed = 7, dur = 1.6) {
  const u = t - t0; if (u <= 0 || u > dur) return;
  const R = rng(seed);
  const cols = ['#ff3b5c', '#ffd23f', '#3bf0ff', '#a259ff', '#4dff9a', '#ffffff'];
  ctx.save();
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (R() - 0.5) * Math.PI * 1.6;
    const v = 700 + R() * 900;
    const px = x + Math.cos(ang) * v * u * 0.8;
    const py = y + Math.sin(ang) * v * u * 0.8 + 900 * u * u;
    const sz = 10 + R() * 14, rot = R() * 6 + u * (R() * 14 - 7);
    ctx.save(); ctx.globalAlpha *= clamp(1 - u / dur) ; ctx.translate(px, py); ctx.rotate(rot);
    ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(-sz / 2, -sz / 4, sz, sz / 2); ctx.restore();
  }
  ctx.restore();
}
function cursor(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1.7 * s, 1.7 * s);
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 40); ctx.lineTo(10, 31); ctx.lineTo(17, 46); ctx.lineTo(24, 43); ctx.lineTo(17, 28); ctx.lineTo(30, 28); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.lineWidth = 2.5; ctx.strokeStyle = '#111'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}
function pill(cx, cy, w, h, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}
// small label pill that slides in
function tag(t, t0, text, cx, cy, color = '#a259ff') {
  const u = eOutBack(p(t, t0, t0 + 0.4)); if (u <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(u); ctx.translate(cx, cy); ctx.scale(u, u);
  const w = measure(text, 34, 800) + 70;
  pill(0, 0, w, 64, rgba(color, 0.18), rgba(color, 0.8));
  ctx.beginPath(); ctx.arc(-w / 2 + 30, 0, 7, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
  txt(text, 12, 2, { size: 34, weight: 800, color: '#fff', shadow: false, ls: 3 });
  ctx.restore();
}

// ---------- background ----------
const PARTS = (() => { const R = rng(42); return Array.from({ length: 80 }, () => ({ x: R() * W, y: R() * H, v: 10 + R() * 40, s: 1 + R() * 2.5, ph: R() * 6.28 })); })();
function background(t) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#070818'); g.addColorStop(1, '#120a2a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  glow(960 + 600 * Math.sin(t * 0.33), 260 + 160 * Math.cos(t * 0.27), 950, '#7c3aed', 0.30);
  glow(960 - 650 * Math.cos(t * 0.29), 820 + 120 * Math.sin(t * 0.41), 900, '#06b6d4', 0.20);
  glow(960 + 400 * Math.sin(t * 0.21 + 2), 540 + 300 * Math.sin(t * 0.17), 700, '#f43f5e', 0.12);
  ctx.globalCompositeOperation = 'source-over';
  // dot grid
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  const off = (t * 18) % 60;
  for (let y = -60 + off; y < H + 60; y += 60) for (let x = -60 + off * 0.5; x < W + 60; x += 60) ctx.fillRect(x, y, 2.5, 2.5);
  // particles
  for (const q of PARTS) {
    const y = ((q.y - t * q.v) % H + H) % H;
    ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2 + q.ph));
    ctx.fillStyle = '#cfd8ff'; ctx.beginPath(); ctx.arc(q.x + Math.sin(t * 0.5 + q.ph) * 20, y, q.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// light streak that sweeps across at scene changes
function wipe(t, tc, c1, c2) {
  const u = p(t, tc - 0.28, tc + 0.28); if (u <= 0 || u >= 1) return;
  const x = -700 + (W + 1400) * eInOut(u);
  ctx.save(); ctx.translate(x, H / 2); ctx.transform(1, 0, -0.45, 1, 0, 0);
  const g = ctx.createLinearGradient(-180, 0, 180, 0); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.globalAlpha = 0.85; ctx.fillRect(-150, -H, 300, 2 * H);
  ctx.globalAlpha = 0.45; ctx.fillRect(-300, -H, 70, 2 * H); ctx.fillRect(200, -H, 34, 2 * H);
  ctx.restore();
}

// scene wrapper: fade + slight zoom on exit
function scene(t, s, e, fn, fin = 0.2, fout = 0.25) {
  if (t < s || t > e) return;
  const a = Math.min(fin ? p(t, s, s + fin) : 1, 1 - p(t, e - fout, e));
  const z = 1 + 0.10 * eInCubic(p(t, e - fout, e));
  ctx.save(); ctx.globalAlpha = a;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  fn(t); ctx.restore();
}

// ---------- scenes ----------
function s1(t) { // "Now over to you."
  line(t, [{ text: 'NOW', t: 0.12 }, { text: 'OVER', t: 0.40 }, { text: 'TO', t: 0.72 }], 960, 420, 150);
  ring(t, 0.88, 960, 660, '#ff6a3d', 100, 420, 0.7, 14);
  sparks(t, 0.88, 960, 660, '#ffd23f', 14, 200, 360, 0.55, 3);
  pop(t, 0.88, 'YOU', 960, 660, { size: 320, grad: ['#ffb000', '#ff4d6d', '#c04dff'], spin: 0.15 });
  pop(t, 1.0, '👉', 960 - 420, 660, { size: 150, emoji: true, spin: 0.4 });
  pop(t, 1.0, '👈', 960 + 420, 660, { size: 150, emoji: true, spin: -0.4 });
}
function s2(t) { // "Which AI video tools are you trying out?"
  const q = eOutElastic(p(t, 3.3, 4.0));
  txt('?', 1560, 560, { size: 900, color: '#ffffff', alpha: 0.05 + 0.05 * q, rot: 0.18 + Math.sin(t) * 0.05, shadow: false, scale: 0.9 + 0.1 * q });
  tag(t, 1.45, 'QUICK QUESTION', 960, 240, '#ffd23f');
  line(t, [{ text: 'WHICH', t: 1.58 }, { text: 'AI', t: 1.9, grad: ['#3bf0ff', '#a259ff'] }, { text: 'VIDEO', t: 2.12, grad: ['#3bf0ff', '#a259ff'] }, { text: 'TOOLS', t: 2.38, grad: ['#a259ff', '#ff4d9a'] }], 960, 450, 140);
  line(t, [{ text: 'ARE', t: 2.64 }, { text: 'YOU', t: 2.82 }, { text: 'TRYING', t: 3.0 }, { text: 'OUT?', t: 3.35, color: '#ffd23f' }], 960, 630, 140);
  // underline sweep under "AI VIDEO TOOLS"
  const u = eOutCubic(p(t, 2.3, 2.75));
  if (u > 0) { ctx.save(); const g = ctx.createLinearGradient(700, 0, 1400, 0); g.addColorStop(0, '#3bf0ff'); g.addColorStop(1, '#ff4d9a'); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(640, 535, 900 * u, 12, 6); ctx.fill(); ctx.restore(); }
  // film-strip ticker at the bottom
  ctx.save(); ctx.globalAlpha *= 0.5 * p(t, 1.5, 2.0);
  const off = (t * 120) % 140;
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, 880, W, 110);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let x = -140 + off; x < W + 140; x += 140) { ctx.beginPath(); ctx.roundRect(x, 892, 30, 18, 4); ctx.fill(); ctx.beginPath(); ctx.roundRect(x, 960, 30, 18, 4); ctx.fill(); }
  ctx.restore();
}
function activeAmt(t, i) {
  const a = p(t, TOOLS[i].t - 0.05, TOOLS[i].t + 0.2);
  const end = i < 4 ? TOOLS[i + 1].t - 0.05 : 8.85;
  return a * (1 - p(t, end, end + 0.2));
}
function s3(t) { // logos: Kling, Hailuo, Vidu, Pika, PixVerse
  tag(t, 4.0, 'AI VIDEO TOOLS', 960, 150, '#3bf0ff');
  const gap = 345;
  // glow behind the active card
  TOOLS.forEach((tl, i) => {
    const a = activeAmt(t, i); if (a <= 0) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(960 + (i - 2) * gap, 500, 520, tl.color, 0.35 * a); ctx.restore();
  });
  TOOLS.forEach((tl, i) => {
    const cx = 960 + (i - 2) * gap, cy0 = 500;
    const u = p(t, tl.t - 0.06, tl.t + 0.42); if (u <= 0) return;
    const a = activeAmt(t, i);
    const wave = Math.sin(Math.PI * p(t, 8.85 + i * 0.07, 9.15 + i * 0.07)) * 30;
    const exit = eInCubic(p(t, 9.05 + i * 0.03, 9.3));
    const s = (0.2 + 0.8 * eOutBack(u)) * (1 + 0.12 * a) * (1 - 0.6 * exit);
    const cy = cy0 - (1 - eOutCubic(u)) * 260 - 22 * a - wave;
    ring(t, tl.t, cx, cy0, tl.color, 120, 330, 0.65, 12);
    sparks(t, tl.t + 0.05, cx, cy0, tl.color, 12, 190, 300, 0.5, i + 5);
    ctx.save(); ctx.globalAlpha *= clamp(u * 3) * (1 - exit);
    ctx.translate(cx, cy); ctx.rotate((1 - eOutCubic(u)) * (i % 2 ? 0.35 : -0.35)); ctx.scale(s, s);
    ctx.shadowColor = a > 0.01 ? rgba(tl.color, 0.9 * a) : 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 30 + 50 * a; ctx.shadowOffsetY = a > 0.01 ? 0 : 12;
    ctx.beginPath(); ctx.roundRect(-140, -165, 280, 330, 40); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 6; ctx.strokeStyle = rgba(tl.color, 0.25 + 0.75 * a); ctx.stroke();
    drawContain(imgs[tl.name], 0, -35, 180);
    txt(tl.name, 0, 112, { size: 42, weight: 800, color: '#14142b', shadow: false });
    ctx.restore();
  });
  // big name of the tool being spoken
  TOOLS.forEach((tl, i) => {
    const a = activeAmt(t, i); if (a <= 0.01) return;
    const u = p(t, tl.t - 0.05, tl.t + 0.3);
    txt(tl.name.toUpperCase(), 960, 850, { size: 130, grad: tl.grad, alpha: a, scale: 0.6 + 0.4 * eOutBack(u), ls: 6 });
  });
  // after the list: "which one?"
  pop(t, 8.95, 'WHICH ONE?', 960, 850, { size: 120, color: '#ffd23f', alpha: 1 - p(t, 9.1, 9.3) });
}
function s4(t) { // "Tell me in the comments section below."
  line(t, [{ text: 'TELL', t: 9.5 }, { text: 'ME', t: 9.66 }, { text: 'IN', t: 9.88 }, { text: 'THE', t: 9.98 }, { text: 'COMMENTS', t: 10.1, grad: ['#3bf0ff', '#a259ff', '#ff4d9a'] }], 960, 230, 120);
  // comment box
  const u = eOutCubic(p(t, 9.35, 9.8)); if (u <= 0) return;
  ctx.save(); ctx.globalAlpha *= u; ctx.translate(0, (1 - u) * 120);
  const bx = 960, by = 520;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  ctx.beginPath(); ctx.roundRect(bx - 600, by - 130, 1200, 260, 36); ctx.fillStyle = 'rgba(28,24,58,0.92)'; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 2; ctx.stroke();
  // avatar
  const ag = ctx.createLinearGradient(bx - 560, by - 90, bx - 440, by + 30); ag.addColorStop(0, '#ffb000'); ag.addColorStop(1, '#ff4d9a');
  ctx.beginPath(); ctx.arc(bx - 500, by - 30, 56, 0, Math.PI * 2); ctx.fillStyle = ag; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(bx - 500, by - 30, 56, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(bx - 500, by - 45, 20, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx - 500, by + 20, 38, 30, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  txt('@you', bx - 410, by - 72, { size: 32, weight: 700, color: '#9aa3c7', align: 'left', shadow: false });
  // typed comment
  const msg = "I'm using Kling + Hailuo! 🔥";
  const chars = [...msg];
  const n = Math.floor(chars.length * p(t, 9.75, 10.75));
  const shown = chars.slice(0, n).join('');
  ctx.font = font(50, 700);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.fillText(shown, bx - 410, by - 10);
  const cw = ctx.measureText(shown).width;
  if (Math.floor(t * 3) % 2 === 0 || n < chars.length) { ctx.fillStyle = '#3bf0ff'; ctx.fillRect(bx - 404 + cw, by - 38, 4, 56); }
  // underline
  const ul = eOutCubic(p(t, 9.7, 10.2));
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(bx - 410, by + 40, 960, 3);
  ctx.fillStyle = '#3bf0ff'; ctx.fillRect(bx - 410, by + 40, 960 * ul, 3);
  // comment button + click
  const press = Math.sin(Math.PI * p(t, 10.85, 11.0));
  const lit = p(t, 10.75, 10.85);
  ctx.save(); ctx.translate(bx + 440, by + 85); ctx.scale(1 - 0.08 * press, 1 - 0.08 * press);
  pill(0, 0, 210, 66, lit > 0 ? mix('#3a3a5a', '#3ea6ff', lit) : '#3a3a5a');
  txt('Comment', 0, 1, { size: 30, weight: 800, color: lit > 0 ? '#0b1020' : '#9aa3c7', shadow: false });
  ctx.restore();
  ring(t, 10.9, bx + 440, by + 85, '#3ea6ff', 40, 160, 0.4, 8);
  ctx.restore();
  // bottom: SECTION BELOW + arrows
  line(t, [{ text: 'SECTION', t: 10.42 }, { text: 'BELOW', t: 10.72, color: '#ffd23f' }, { text: '👇', t: 10.8, emoji: true, rot: 0 }], 960, 800, 100);
  const au = p(t, 10.8, 11.0);
  if (au > 0) for (let k = 0; k < 3; k++) {
    const yy = 900 + k * 34 + ((t * 90) % 34);
    ctx.save(); ctx.globalAlpha *= au * (0.9 - k * 0.25); ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(930, yy); ctx.lineTo(960, yy + 22); ctx.lineTo(990, yy); ctx.stroke(); ctx.restore();
  }
}
function s5(t) { // "And if you've tested more than one, tell us which one gave you the best results."
  // phase A text
  ctx.save(); const outA = eInCubic(p(t, 12.75, 13.0)); ctx.globalAlpha *= 1 - outA; ctx.translate(0, -80 * outA);
