<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Graphic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- The stage is the video frame. Everything inside it is captured. -->
  <div id="stage">
    <!-- PLACEHOLDER: replace with the real animation -->
    <div class="box"></div>
    <h1 class="title">Ready to animate</h1>
  </div>

  <!-- Preview controls (hidden during capture) -->
  <div id="controls">
    <button id="play">Pause</button>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
    <span id="time">0.00s</span>
  </div>

  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="animation.js"></script>
  <script src="harness.js"></script>
</body>
</html>
